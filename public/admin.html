<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICCHA Admin — Add Product</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/style.css">

<style>
  body{
    padding: 32px 24px 60px;
  }

  .admin-shell{
    max-width: 880px;
    margin: 0 auto;
  }

  .admin-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 24px;
  }
  .admin-brand{
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold, #c79a5c);
  }
  .admin-topbar h1{
    font-size: 22px;
    margin: 4px 0 0;
  }

  .admin-card{
    background: var(--card-bg, #221414);
    border: 1px solid var(--stroke, rgba(255,255,255,0.08));
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .admin-card h3{
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin: 0 0 16px;
  }

  .admin-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 640px){
    .admin-grid{ grid-template-columns: 1fr; }
  }

  .admin-field{
    display:flex;
    flex-direction:column;
    gap: 6px;
    margin-bottom: 4px;
  }
  .admin-field label{
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    text-align: center;
  }

  input, textarea, select{
    width: 100%;
    padding: 12px 14px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s ease, background .15s ease;
  }
  input:focus, textarea:focus, select:focus{
    border-color: var(--gold, #c79a5c);
    background: rgba(199,154,92,0.06);
  }

  /* Native dropdown popup: browsers render this with their own
     white background, so option text needs its own dark color
     rather than inheriting the select's white text */
  select option{
    background: #221414;
    color: #fff;
  }

  /* Safety net: if admin-ui.js hasn't loaded/run for any reason,
     this alone still prevents the native select from doubling up
     visually next to the custom dropdown box. */
  .custom-select + select{
    display: none;
  }

  /* ===== Custom themed dropdown (replaces native select popup) ===== */
  .custom-select{
    position: relative;
  }
  .custom-select-trigger{
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .custom-select-trigger:hover,
  .custom-select.open .custom-select-trigger{
    border-color: var(--gold, #c79a5c);
  }
  .custom-select-value.placeholder{
    color: rgba(255,255,255,0.45);
  }
  .custom-select-caret{
    flex-shrink: 0;
    opacity: 0.6;
    transition: transform .15s ease;
  }
  .custom-select.open .custom-select-caret{
    transform: rotate(180deg);
  }
  .custom-select-menu{
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: #221414;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 10px;
    padding: 6px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 50;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    display: none;
  }
  .custom-select.open .custom-select-menu{
    display: block;
  }
  .custom-select-option{
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    color: #fff;
    cursor: pointer;
  }
  .custom-select-option:hover,
  .custom-select-option.active{
    background: var(--gold, #c79a5c);
    color: #1a1010;
    font-weight: 600;
  }
  .custom-select-group{
    padding: 10px 12px 4px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
  }
  .custom-select-group:first-child{
    padding-top: 2px;
  }
  .custom-select-menu::-webkit-scrollbar{ width: 6px; }
  .custom-select-menu::-webkit-scrollbar-thumb{
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
  }
  textarea{ min-height: 90px; resize: vertical; }

  input[type="file"]{
    padding: 10px 12px;
  }
  input[type="checkbox"]{
    width: auto;
    accent-color: var(--gold, #c79a5c);
  }

  .full-span{ grid-column: 1 / -1; }

  #imageList > div{
    background: rgba(255,255,255,0.05) !important;
  }

  .size-pills{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
  }
  .size-pill{
    min-width: 52px;
    text-align: center;
    padding: 10px 16px;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    cursor: pointer;
    font-size: 13.5px;
    color: rgba(255,255,255,0.75);
    transition: .15s ease;
  }
  .size-pill:hover{
    border-color: var(--gold, #c79a5c);
    background: rgba(199,154,92,0.08);
  }
  .size-pill.active{
    background: var(--gold, #c79a5c);
    border-color: var(--gold, #c79a5c);
    color: #1a1010;
    font-weight: 600;
  }

  .featured-row{
    display:flex;
    align-items:center;
    gap: 10px;
    font-size: 14px;
    color: rgba(255,255,255,0.8);
    margin: 6px 0 4px;
  }
  .featured-row input{ width: 18px; height: 18px; }

  .btn-admin-primary{
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(180deg, #7a1f2b, var(--brand, #6b0015));
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(107,0,21,0.35);
    margin-top: 8px;
    transition: .15s ease;
  }
  .btn-admin-primary:hover{ filter: brightness(1.08); transform: translateY(-1px); }

  #msg{
    text-align:center;
    font-size: 13.5px;
    color: var(--gold, #c79a5c);
    min-height: 18px;
    margin: 12px 0 0;
  }

  .btn-admin-ghost{
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.16);
    background: transparent;
    color: #fff;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: .15s ease;
  }
  .btn-admin-ghost:hover{ border-color: var(--gold, #c79a5c); color: var(--gold, #c79a5c); }

  #productList{
    display: grid;
    gap: 10px;
  }
</style>
</head>

<body>

<div class="admin-shell">

  <div class="admin-topbar">
    <div>
      <span class="admin-brand">ICCHA Admin</span>
      <h1>Add Product</h1>
    </div>
  </div>

  <div class="admin-card">
    <h3>Product Details</h3>

    <div class="admin-grid">
      <div class="admin-field">
        <label for="name">Product Name</label>
        <input id="name" placeholder="e.g. Embroidered Silk Saree">
      </div>
      <div class="admin-field">
        <label for="brand">Brand / Collection</label>
        <input id="brand" placeholder="Optional">
      </div>

      <div class="admin-field">
        <label for="mrp">MRP (Original Price)</label>
        <input id="mrp" type="number" placeholder="INR" min="1">
      </div>
      <div class="admin-field">
        <label for="offerPrice">Offer Price</label>
        <input id="offerPrice" type="number" placeholder="Optional — INR" min="1">
      </div>

      <div class="admin-field full-span">
        <label for="images">Product Images</label>
        <input type="file" id="images" multiple>
        <div id="imageList"></div>
      </div>

      <div class="admin-field">
        <label for="category">Category</label>
        <div class="custom-select" data-for="category">
          <button type="button" class="custom-select-trigger">
            <span class="custom-select-value">Select Category</span>
            <svg class="custom-select-caret" width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="custom-select-menu"></div>
        </div>
        <select id="category">
          <option value="">Select Category</option>
          <optgroup label="Clothes">
            <option value="Sarees">Sarees</option>
            <option value="Kurtis">Kurtis</option>
            <option value="Co-ord Sets">Co-ord Sets</option>
            <option value="Dresses">Dresses</option>
            <option value="Denim">Denim</option>
            <option value="Shirts">Shirts</option>
            <option value="Pants">Pants</option>
            <option value="Kids Ethnic Wear">Kids Ethnic Wear</option>
            <option value="Kids Western Wear">Kids Western Wear</option>
            <option value="Kids Party Wear">Kids Party Wear</option>
          </optgroup>
          <optgroup label="Accessories">
            <option value="Bags">Bags</option>
            <option value="Jewelry">Jewelry</option>
            <option value="Belts">Belts</option>
            <option value="Scarves">Scarves</option>
            <option value="Watches">Watches</option>
          </optgroup>
          <optgroup label="Fragrances">
            <option value="Perfumes">Perfumes</option>
            <option value="Deodorants">Deodorants</option>
            <option value="Attars">Attars</option>
          </optgroup>
          <optgroup label="Footwear">
            <option value="Heels">Heels</option>
            <option value="Flats">Flats</option>
            <option value="Sneakers">Sneakers</option>
            <option value="Sandals">Sandals</option>
            <option value="Kids Footwear">Kids Footwear</option>
          </optgroup>
        </select>
      </div>
      <div class="admin-field">
        <label for="gender">Gender</label>
        <div class="custom-select" data-for="gender">
          <button type="button" class="custom-select-trigger">
            <span class="custom-select-value">Select Gender</span>
            <svg class="custom-select-caret" width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="custom-select-menu"></div>
        </div>
        <select id="gender">
          <option value="">Select Gender</option>
          <option value="men">Men</option>
          <option value="women">Women</option>
          <option value="kids">Kids</option>
          <option value="boys">Boys</option>
          <option value="girls">Girls</option>
          <option value="Unisex">Unisex</option>
        </select>
      </div>

      <div class="admin-field full-span">
        <label>Select Sizes</label>
        <div class="size-pills">
          <span class="size-pill" data-size="XS">XS</span>
          <span class="size-pill" data-size="S">S</span>
          <span class="size-pill" data-size="M">M</span>
          <span class="size-pill" data-size="L">L</span>
          <span class="size-pill" data-size="XL">XL</span>
          <span class="size-pill" data-size="XXL">XXL</span>
          <span class="size-pill" data-size="3XL">3XL</span>
          <span class="size-pill" data-size="Free Size">Free Size</span>
        </div>
      </div>

      <div class="admin-field full-span">
        <label for="colors">Colors</label>
        <input id="colors" placeholder="e.g. Red / Maroon / Gold">
      </div>

      <div class="admin-field full-span">
        <label for="details">Product Details</label>
        <textarea id="details" placeholder="Fabric, fit, care instructions..."></textarea>
      </div>

      <div class="admin-field full-span">
        <label for="description">Short Description</label>
        <textarea id="description" placeholder="One or two lines shown on the shop card"></textarea>
      </div>

      <div class="full-span featured-row">
        <input type="checkbox" id="featured" />
        <label for="featured" style="margin:0;">Mark as Featured Product</label>
      </div>
    </div>

    <button id="addBtn" class="btn-admin-primary">Add Product</button>
    <p id="msg"></p>
  </div>

  <div class="admin-card">
    <h3>Existing Products</h3>
    <div id="productList"></div>
  </div>

  <button onclick="window.location.href='admin-products.html'" class="btn-admin-ghost">
    Manage Products
  </button>

  <button onclick="window.location.href='admin-orders.html'" class="btn-admin-ghost" style="margin-top:10px;">
    View Orders
  </button>

</div>

<script src="js/config.js"></script>
<script src="js/admin-ui.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
