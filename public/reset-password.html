<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password | ICCHA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background: #0b0d14;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .box {
      width: 100%;
      max-width: 400px;
      background: #141827;
      padding: 30px;
      border-radius: 12px;
    }
    h2 { margin-bottom: 20px; }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }
    input {
      background: #1d2236;
      color: #fff;
    }
    button {
      background: #5b7cfa;
      color: #fff;
      cursor: pointer;
    }
    .msg {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Reset Password</h2>

    <input type="password" id="password" placeholder="New password" />
    <button id="resetBtn">Update Password</button>

    <div class="msg" id="msg"></div>
  </div>

<script>
  const API = "https://iccha-backend.onrender.com";

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  const msg = document.getElementById("msg");

  if (!token) {
    msg.textContent = "Invalid or missing reset token.";
    msg.style.color = "red";
  }

  document.getElementById("resetBtn").onclick = async () => {
    const password = document.getElementById("password").value.trim();
    if (!password) {
      msg.textContent = "Please enter a new password.";
      msg.style.color = "red";
      return;
    }

    try {
      const res = await fetch(API + "/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed");

      msg.textContent = "Password updated successfully. You can now login.";
      msg.style.color = "lightgreen";

      setTimeout(() => {
        window.location.href = "/index.html";
      }, 2000);

    } catch (e) {
      msg.textContent = e.message;
      msg.style.color = "red";
    }
  };
</script>

</body>
</html>
