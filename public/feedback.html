<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Feedback | ICCHA</title>
  <style>
   :root{
  --bg: #0b0c0f;
  --bg-2: #101218;
  --text: #ffffff;
  --muted: rgba(255,255,255,.72);
  --line: rgba(255,255,255,.10);

  --brand: #ff3425;
  --brand-ink: #0b0c0f;

  --radius: 16px;
  --radius-pill: 999px;
  --shadow: 0 16px 40px rgba(0,0,0,.45);

  --container: 1200px;
  --gutter: 20px; /* same as 40px total in .container calc(100% - 40px) */

  --accent:#ff2a2a;
  --card:rgba(255,255,255,0.04);
  --stroke:rgba(255,255,255,0.08);

}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  padding: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
img{ max-width:100%; display:block; }

.site-header{
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(11,12,15,.72);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.header-inner{
  height: 76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:var(--text);
}
.brand-text{
  font-weight: 900;
  letter-spacing: .08em;
  font-size: 18px;
}
.brand-logo{
  height: 56px;
  width: auto;
  max-width: none;
  display: block;
}

.container{
  width: min(var(--container), calc(100% - 40px));
  margin-inline:auto;
}

.feedback-section {
  padding: 100px 20px;
  background: radial-gradient(
    circle at top,
    #111 0%,
    #050608 60%,
    #000 100%
  );
}

.feedback-container {
  max-width: 680px;
  margin: 0 auto;
  padding: 48px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 22px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
}

.feedback-container h2 {
  font-size: 2.4rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 12px;
}

.feedback-subtext {
  color: #b5b8c7;
  margin-bottom: 36px;
  line-height: 1.6;
}

.feedback-form .form-group {
  margin-bottom: 22px;
}

.feedback-form label {
  display: block;
  margin-bottom: 6px;
  font-size: 0.9rem;
  color: #d6d6d6;
}

.feedback-form input,
.feedback-form textarea {
  width: 100%;
  padding: 14px 16px;
  background: #0f1117;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  color: #ffffff;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.feedback-form input::placeholder,
.feedback-form textarea::placeholder {
  color: #6f7383;
}

.feedback-form input:focus,
.feedback-form textarea:focus {
  border-color: #ff1f1f;
  box-shadow: 0 0 0 2px rgba(255, 42, 31, 0.15);
}

.btn-primary {
  margin-top: 10px;
  padding: 14px 32px;
  background: #ff1f1f;
  color: #000;
  font-weight: 600;
  font-size: 1rem;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(255, 31, 31, 0.35);
}

.form-note {
  margin-top: 16px;
  font-size: 0.85rem;
  color: #8f93a3;
}

</style>

</head>
<body>

  <!-- ===== HEADER (paste your same site header here) ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="ICCHA Home">
        <img src="images/logo.png" alt="ICCHA" class="brand-logo" /> 
      </a>
    </div>
  </header>
  
  <section class="feedback-section" id="feedback">
  <div class="feedback-container">
    <h2>We’d Love Your Feedback</h2>
    <p class="feedback-subtext">
      Share your thoughts, suggestions, or questions. Your feedback helps us improve ICCHA.
    </p>

    <form class="feedback-form" action="https://formspree.io/f/xjgkneey" method="POST">
      <div class="form-group">
        <label for="name">Name (optional)</label>
        <input type="text" id="name" name="name" placeholder="Your name">
      </div>

      <div class="form-group">
        <label for="email">Email (optional)</label>
        <input type="email" id="email" name="email" placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label for="message">Your Feedback</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your feedback here..." required></textarea>
      </div>

      <button type="submit" class="btn-primary">Send Feedback</button>

      <p class="form-note">We respect your privacy. No spam, ever.</p>
    </form>
  </div>
</section>
